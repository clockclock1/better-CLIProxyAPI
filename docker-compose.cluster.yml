services:
  cli-proxy-api:
    # Default: pull the GHCR image built by this fork's Packages workflow.
    image: ${CLI_PROXY_IMAGE:-ghcr.io/clockclock1/better-cliproxyapi:latest}
    pull_policy: ${CLI_PROXY_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "8317:8317"
    volumes:
      - ${CLI_PROXY_HOME_PATH:-./home}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./CLIProxyAPI -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
